<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="freelance-timer logo">
  <title>freelance-timer</title>
  <!-- stopwatch body -->
  <g fill="none" stroke="#0F172A" stroke-width="28" stroke-linejoin="round">
    <circle cx="256" cy="290" r="170"/>
  </g>
  <!-- crown + stem -->
  <rect x="222" y="40" width="68" height="40" rx="12" fill="#0F172A"/>
  <rect x="242" y="78" width="28" height="42" fill="#0F172A"/>
  <!-- side button -->
  <rect x="382" y="104" width="64" height="30" rx="12" fill="#0F172A" transform="rotate(45 414 119)"/>
  <!-- tick marks -->
  <g stroke="#0F172A" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="148" x2="256" y2="166"/>
    <line x1="256" y1="414" x2="256" y2="432"/>
    <line x1="114" y1="290" x2="132" y2="290"/>
    <line x1="380" y1="290" x2="398" y2="290"/>
  </g>
  <!-- elapsed arc + hand (accent) -->
  <path d="M256 170 A120 120 0 0 1 359.9 230" fill="none" stroke="#F5A524" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="290" x2="342.6" y2="240" stroke="#F5A524" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="290" r="18" fill="#0F172A"/>
  <circle cx="256" cy="290" r="7" fill="#F5A524"/>
</svg>
